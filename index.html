<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Terminwahl</title>

<style>
body{
    font-family: Arial;
    text-align: center;
    margin-top: 40px;
}

h1{
    margin-bottom: 20px;
}

.container{
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
}

.slot{
    padding: 15px 20px;
    border: 1px solid #ccc;
    border-radius: 10px;
    cursor: pointer;
    min-width: 160px;
    transition: 0.2s;
}

.slot:hover{
    background: #f0f0f0;
}
</style>
</head>

<body>

<h1>Bitte Termin wählen</h1>

<div class="container" id="slots"></div>

<script>

const API = "https://script.google.com/macros/s/AKfycbwjIGapJstUg6NGhllB6NXXCSD9f1hOsswtYKwxiGeFLe1qEXJmKIBtiwil0C6Kg5HN/exec";

async function loadSlots(){

    const res = await fetch(API);
    const booked = await res.json();

    const container = document.getElementById("slots");
    container.innerHTML = "";

    // Beispiel fixe Slots (du kannst sie im Sheet pflegen)
    const allSlots = [
        "01.07. 10:00",
        "01.07. 11:00",
        "01.07. 14:00",
        "02.07. 10:00",
        "02.07. 14:00"
    ];

    const free = allSlots.filter(s => !booked.includes(s));

    free.forEach(s => {

        const div = document.createElement("div");
        div.className = "slot";
        div.innerText = s;

        div.onclick = async () => {

            await fetch(API, {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: "termin=" + encodeURIComponent(s)
            });

            alert("Termin reserviert: " + s);
            loadSlots();
        };

        container.appendChild(div);
    });
}

loadSlots();

</script>

</body>
</html>
