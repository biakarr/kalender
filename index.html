<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Terminwahl</title>

<style>
body{
    font-family: Arial;
    text-align: center;
    margin-top: 40px;
}

.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:15px;
}

.slot{
    padding:18px 22px;
    border:1px solid #ccc;
    border-radius:12px;
    cursor:pointer;
    min-width:220px;
    transition:0.2s;
    background:white;
}

.slot:hover{
    background:#f0f0f0;
}
</style>
</head>

<body>

<h1>Bitte Zeitraum auswählen</h1>

<div class="container" id="slots"></div>

<script>

const API = "https://script.google.com/macros/s/AKfycbzvwv7PtuIUlF7AwF85sUZUcHlH0_f9esIKXf5ZrC24MYqeHLGYLs2xUsLAWAvhbQGQ/exec"
async function load(){

    const res = await fetch(API);
    const booked = await res.json();

    const container = document.getElementById("slots");
    container.innerHTML = "";

    booked.forEach(t => {

        const div = document.createElement("div");
        div.className = "slot";
        div.innerText = t;

        div.onclick = async () => {

            const ok = confirm("Diesen Zeitraum buchen?\n\n" + t);

            if(!ok) return;

            await fetch(API, {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: "termin=" + encodeURIComponent(t)
            });

            alert("Gebucht: " + t);
            load();
        };

        container.appendChild(div);
    });
}

load();

</script>

</body>
</html>
