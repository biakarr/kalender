<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Slots</title>

<style>
body{
    font-family: Arial;
    text-align: center;
    margin-top: 50px;
}

.kachel{
    display:inline-block;
    padding:20px;
    margin:10px;
    border:1px solid #ccc;
    border-radius:10px;
    cursor:pointer;
}

.kachel:hover{
    background:#eee;
}
</style>
</head>

<body>

<h1>Bitte Termin wählen</h1>

<div id="slots"></div>

<script>
const slots = [
"01.07. 10:00",
"01.07. 11:00",
"01.07. 14:00"
];

const container = document.getElementById("slots");

slots.forEach(s => {
    const div = document.createElement("div");
    div.className = "kachel";
    div.innerText = s;

    div.onclick = () => {
        alert("Ausgewählt: " + s);
    };

    container.appendChild(div);
});
</script>

</body>
</html>
